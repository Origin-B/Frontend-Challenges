<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Product Preview Card || HTML && CSS</title>
</head>
<body>
  <main>
    <section class="perfume-img"></section>

    <section class="perfume-intro">

      <p>Perfume</p>

      <h1 class="fraunces">
        Gabrielle Essence Eau De Parfum
      </h1>

      <p>
        A floral, solar and voluptuous interpretation composed by Olivier Polge,Perfumer-Creator for the House of CHANEL.
      </p>

      <p class="perfume-price">
        <span class="current-price fraunces">$149.99</span>
        <span>$169.99</span>
      </p>

      <button type="button" aria-label="click to add to cart">
        <img src="images/icon-cart.svg" alt="Icon Of Cart">
        <span>Add to Cart</span>
      </button>

    </section>
  </main>
  <footer class="attribution">
    <img src="images/Logo.jpeg" alt="OriginB Official Logo">
    <p>
      Coded by <a href="https://github.com/Origin-B" target="_blank">OriginB</a>.
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    </p>
  </footer>
</body>
</html>
