<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>NFT preview Card || HTML && CSS</title>
</head> 
<body>
  <main>
    <figure>
      <img src="images/image-equilibrium.jpg" alt="Equilibrium Image">
      <div class="overlay">
        <img src="images/icon-view.svg" alt="View Icon">
      </div>
    </figure>
    <section>
      <h2>Equilibrium #3429</h2>
      <p>Our Equilibrium collection promotes balance and calm.</p>
      <div class="div-icon">
        <p>
          <img src="images/icon-ethereum.svg" alt="Ethereum Icon">
          <span>0.041 ETH</span>
        </p>
        <p>
          <img src="images/icon-clock.svg" alt="Clock Icon">
          <span>3 days left</span>
        </p>
      </div>
    </section>
    <section>
      <img src="images/image-avatar.png" alt="Avatar Image">
      <p>Creation of <span class="p__span--color">Jules Wyvern</span></p>
    </section>
  </main>
  <footer class="attribution">
    <img src="images/Logo.jpeg" alt="OriginB Official Logo">
    <p>Coded by <a href="https://github.com/Origin-B" target="_blank">OriginB</a>.
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.</p>
  </footer>
</body>
</html>
