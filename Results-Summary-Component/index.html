<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Results Summary Component || HTML && CSS</title>
</head>
<body class="flex-column-dir">
  <main>
  <section class="flex-column-dir">
    <p>Your Result</p>
    <p class="crucial">
      <span>76</span>
      <span>of 100</span>
    </p>
    <div>
      <h1>Great</h1>
      <p>You scored higher than 65% of the people who have taken these tests.</p>      
    </div>
  </section>
  <section class="flex-column-dir sec__div--back">
    <h2>Summary</h2>
    <div class="div--display-flex">
      <p class="div--display-flex">
        <img src="images/icon-reaction.svg" alt="Reaction Icon">
        <span class="reaction">Reaction</span>
    </p>
      <p>
        <span class="p__span--color">80 </span>/ 100
      </p>
    </div>
    <div class="div--display-flex">
      <p class="div--display-flex">
        <img src="images/icon-memory.svg" alt="Memory Icon">
        <span class="memory">Memory</span>
      </p>
      <p>
        <span class="p__span--color">92 </span>/ 100
      </p>
    </div>
    <div class="div--display-flex">
      <p class="div--display-flex">
        <img src="images/icon-verbal.svg" alt="Verbal Icon">
        <span class="verbal">Verbal</span>
      </p>
      <p>
        <span class="p__span--color">61 </span>/ 100
      </p>
    </div>
    <div class="div--display-flex">
      <p class="div--display-flex">
        <img src="images/icon-visual.svg" alt="Visual Icon">
        <span class="visual">Visual</span>
      </p>
      <p>
        <span class="p__span--color">73 </span>/ 100
      </p>
    </div>
    <button type="button">Continue</button>
  </section>
  </main>
  <footer class="attribution">
    <img src="images/Logo.jpeg" alt="OriginB Official Logo">
    <p>Coded by <a href="https://github.com/Origin-B" target="_blank">OriginB</a>.
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.</p>
  </footer>
</body>
</html>
