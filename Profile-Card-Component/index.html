<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Profile Card Component || HTML && CSS</title>
</head>
<body>
  <main>
    <img src="images/bg-pattern-card.svg" alt="Cover Photo">

    <section>
      <article class="about">
        <img src="images/image-victor.jpg" alt="Victor Profile Picture">
        <h1>
          <span class="username">Victor Crest</span>
          <span>26</span>
        </h1>
        <p>London</p>
      </article>

      <article class="stats">
        <p>
          <span class="stat">80K</span>
          <span>Followers</span>
        </p>
        <p>
          <span class="stat">803K</span>
          <span>Likes</span>
        </p>
        <p>
          <span class="stat">1.4K</span>
          <span>Photos</span>
        </p>
      </article>
    </section>
  </main>
  <footer class="attribution">
    <img src="images/Logo.jpeg" alt="OriginB Official Logo">
    <p>
      Coded by <a href="https://github.com/Origin-B" target="_blank">OriginB</a>.
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    </p>
  </footer>
</body>
</html>
