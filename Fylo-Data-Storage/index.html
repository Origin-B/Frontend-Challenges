<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Fylo Data Storage</title>
</head>
<body>
  <main>

    <section>
      <img src="images/logo.svg" alt="Fylo Data Storage Logo">
      <ul>
        <li><img src="images/icon-document.svg" alt="Document Icon" role="presentation"></li>
        <li><img src="images/icon-folder.svg" alt="Folder Icon" role="presentation"></li>
        <li><img src="images/icon-upload.svg" alt="Upload Icon" role="presentation"></li>
      </ul>
    </section>

    <section class="details-sec">
      <p>You’ve used <span class="font-weight">815 GB</span> of your storage</p>

      <p class="flowchart"></p>

      <p class="storage-labels">
        <span class="font-weight">0 GB</span>
        <span class="font-weight">1000 GB</span>
      </p>

      <p class="storage-remaining"><span>185</span> GB Left</p>
    </section>

  </main>

  <footer class="attribution">
    <img src="images/Logo.jpeg" alt="OriginB Official Logo">
    <p>
      Coded by <a href="https://github.com/Origin-B" target="_blank">OriginB</a>.
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    </p>
  </footer>
</body>
</html>
